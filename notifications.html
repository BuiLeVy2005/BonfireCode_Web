<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - BonfireCode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #e5e5e5; }
        .fire-text { background: linear-gradient(180deg, #c084fc 0%, #9333ea 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .gh-border { border-color: #30363d; }
        .gh-bg-secondary { background-color: #161b22; }
        .gh-hover:hover { background-color: #30363d; }
        
        /* Rank Styles */
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }
    </style>
    <link rel="icon" type="image/jpeg" href="assets/images/1.jpg">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#010409] border-b gh-border sticky top-0 z-50">
        <div class="flex justify-between items-center px-6 py-3">
            <div class="flex items-center gap-6">
                <a href="dashboard.html" class="flex items-center gap-3 hover:opacity-80 transition">
                    <img src="assets/images/1.jpg" alt="Logo" class="w-8 h-8 rounded-full object-cover border border-gray-600">
                    <span class="logo-text text-xl font-semibold text-gray-100 tracking-wider">BonfireCode</span>
                </a>
                <a href="leaderboard.html" class="hidden md:flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition">
                    <i class="fa-solid fa-trophy text-yellow-500"></i> Bảng Xếp Hạng
                </a>
            </div>
            <div class="flex items-center gap-4" id="auth-buttons">
                <a href="auth.html" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Đăng nhập</a>
                <a href="auth.html" class="border border-gray-600 hover:border-gray-400 text-gray-300 hover:text-white px-3 py-1 rounded-md text-sm font-medium transition duration-300">Đăng ký</a>
            </div>
            <div class="flex items-center gap-4 hidden" id="user-buttons">
                <a href="upload.html" class="flex items-center gap-1 bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded-md text-sm font-medium transition duration-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Upload
                </a>
                
                <!-- Notification Bell -->
                <div class="relative">
                    <button id="btn-notification" class="relative p-2 text-gray-400 hover:text-white transition focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <!-- Red Dot for unread (hidden by default) -->
                        <span id="notification-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-[#0d1117]"></span>
                    </button>

                    <!-- Notifications Dropdown -->
                    <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-[#161b22] border border-[#30363d] rounded-md shadow-[0_8px_24px_rgba(0,0,0,0.5)] z-50 text-sm overflow-hidden flex flex-col max-h-96">
                        <div class="px-4 py-3 border-b border-[#30363d] flex justify-between items-center bg-[#0d1117]">
                            <h3 class="font-semibold text-gray-200">Thông báo</h3>
                            <button id="btn-read-all-notifs" class="text-xs text-blue-400 hover:text-blue-300 transition">Đánh dấu đã đọc</button>
                        </div>
                        
                        <div id="notification-list" class="flex-1 overflow-y-auto">
                            <!-- Items go here -->
                            <div class="p-4 text-center text-gray-500 text-xs">Đang tải thông báo...</div>
                        </div>
                        
                        <div class="px-4 py-2 border-t border-[#30363d] text-center bg-[#0d1117]">
                            <a href="notifications.html" class="text-xs text-blue-400 hover:text-blue-300">Xem tất cả</a>
                        </div>
                    </div>
                </div>
                <!-- Avatar Dropdown -->
                <div class="relative">
                    <button id="btn-avatar-dropdown" class="flex items-center justify-center rounded-full border border-gray-700 hover:border-gray-400 transition focus:outline-none">
                        <img src="https://placehold.co/100x100/161b22/8b949e?text=U" alt="User" class="w-8 h-8 rounded-full">
                    </button>
                    
                    <!-- Dropdown Menu -->
                    <div id="user-dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-[#161b22] border border-[#30363d] rounded-md shadow-[0_8px_24px_rgba(0,0,0,0.5)] py-1 z-50 text-sm">
                        <div class="px-4 py-2 border-b border-[#30363d]">
                            <p class="font-semibold text-gray-200 truncate" id="dropdown-username">User</p>
                        </div>
                        <div class="py-1">
                            <a href="profile.html" class="flex items-center px-4 py-1.5 text-gray-300 hover:bg-[#0366d6] hover:text-white transition">Hồ sơ của tôi</a>
                        </div>
                        <div class="py-1 border-t border-[#30363d]">
                            <button id="btn-logout" class="w-full text-left flex items-center px-4 py-1.5 text-gray-300 hover:bg-[#0366d6] hover:text-white transition">Đăng xuất</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
        <main class="flex-1 max-w-4xl mx-auto w-full p-6 mt-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold fire-text"><i class="fa-solid fa-bell mr-3"></i>Tất Cả Thông Báo</h1>
            <button id="btn-read-all-page" class="bg-[#21262d] hover:bg-[#30363d] text-gray-300 px-4 py-2 rounded-md border border-[#30363d] transition text-sm font-medium">
                <i class="fa-solid fa-check-double mr-2"></i>Đánh dấu tất cả đã đọc
            </button>
        </div>
        
        <div class="bg-[#0d1117] border gh-border rounded-xl shadow-lg overflow-hidden">
            <div id="full-notification-list" class="flex flex-col min-h-[300px]">
                <div class="flex items-center justify-center h-40 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang tải thông báo...
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t gh-border mt-auto py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 BonfireCode. Bảng Xếp Hạng Kẻ Khống Lửa.</p>
    </footer>

    <script src="notifications.js"></script>
    <script src="app.js"></script>
</body>
</html>
